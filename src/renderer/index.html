<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Defence-in-depth CSP: only allow scripts/styles/images from the app
       bundle. blob: is allowed for script-src AND worker-src so the inline
       AudioWorklet (Whisper STT) and pdfjs-dist Web Worker can load. Inline
       styles are required by KaTeX rendering, so 'unsafe-inline' is left on
       for style-src only. img-src allows data: for pasted screenshots and
       https: for favicons. No remote scripts. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' blob: http://localhost:* http://127.0.0.1:*; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none';">
  <title>Friday Assistant</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="../../node_modules/katex/dist/katex.min.css">
  <script src="../../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="../../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
  <script src="../../node_modules/katex/dist/katex.min.js"></script>
</head>
<body data-mode="chat">
  <div id="app">
    <!-- Title Bar -->
    <div class="title-bar">
      <div class="title">
        <span class="friday-icon">F</span>
        <span class="app-name">Friday</span>
        <span class="title-sep" id="titleSep">›</span>
        <span class="session-label" id="sessionTitleLabel"></span>
      </div>
      <div class="title-actions">
        <button class="sugg-toggle-btn" id="suggToggleBtn" title="Suggestions panel" aria-label="Suggestions">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 8v4l3 3"/><circle cx="18" cy="6" r="3" fill="currentColor" stroke="none" opacity="0.6"/></svg>
        </button>
        <button class="incog-toggle-btn" id="incogToggleBtn" title="Incognito mode (local only)" aria-label="Incognito mode">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a7 7 0 0 0-7 7v10.5l2.2-1.6 2.2 1.6 2.3-1.6 2.3 1.6 2.2-1.6 2.2 1.6V10a7 7 0 0 0-7-7z"/>
            <circle cx="9.4" cy="11" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="14.6" cy="11" r="1.1" fill="currentColor" stroke="none"/>
            <path d="M10.2 14.8c.6.5 1.2.7 1.8.7s1.2-.2 1.8-.7"/>
          </svg>
        </button>
        <button class="perm-toggle-btn" id="permToggleBtn" title="All permissions enabled - click to require prompts" aria-label="Tool permissions" aria-pressed="true">
          <svg class="perm-icon-on" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path d="M8 11V8a4 4 0 0 1 7.3-2.3"/>
            <circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
          <svg class="perm-icon-off" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <rect x="4" y="11" width="16" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            <circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button class="todo-open-btn" id="todoOpenBtn" title="To-Do (Ctrl+Shift+T)" aria-label="Open To-Do">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 6h10M10 12h10M10 18h10"/>
            <path d="M3.2 6.1l1.3 1.3 2.3-2.5"/>
            <path d="M3.2 12.1l1.3 1.3 2.3-2.5"/>
            <circle cx="4.6" cy="18" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>
        <button class="reload-btn" id="reloadBtn" title="Reload window">↺</button>
        <div class="window-controls">
          <button class="window-btn minimize-btn" id="minimizeBtn">−</button>
          <button class="window-btn close-btn" id="closeBtn">×</button>
        </div>
      </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
      <!-- Chat Area -->
      <div class="chat-area">
        <div class="chat-messages" id="chatMessages">
          <div class="welcome-message" id="welcomeMessage">
            <h2>Hi! I'm Friday</h2>
            <p id="welcomeSubtext">Your personal AI assistant. Ask me anything!</p>
          </div>
        </div>

        <!-- Token warning bar (hidden until context > 90%) -->
        <div class="token-warning-bar hidden" id="tokenWarningBar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span id="tokenWarningText">Context nearly full - compacting soon</span>
        </div>

        <!-- Permission banner (emitted by AgentRuntime permission.request events) -->
        <div id="permissionBannerContainer"></div>

        <!-- Input Area -->
        <div class="input-area">
          <div id="imagePreviewStrip" class="image-preview-strip"></div>
          <div id="visionWarning" class="vision-warning" style="display:none">
            ⚠ Selected model may not support images. Switch to a vision model (marked 👁).
          </div>
          <textarea
            id="userInput"
            placeholder="Ask me anything... (Ctrl+I to focus, Ctrl+Shift+M for mic, Ctrl+Shift+Space to toggle)"
            rows="2"
          ></textarea>
          <div class="input-footer">
            <div class="input-footer-left">
              <button id="attachBtn" class="input-tool-btn attach-btn" title="Attach image (or paste / drag-drop)">📎</button>
              <button id="micBtn" class="input-tool-btn mic-btn" title="Voice input (click or Ctrl+Shift+M to start / stop)">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="2" width="6" height="12" rx="3"/>
                  <path d="M5 10a7 7 0 0 0 14 0M12 19v3M9 22h6"/>
                </svg>
              </button>
              <button id="searchToggleBtn" class="input-tool-btn search-toggle-btn" title="Force web search">🔍</button>
              <button id="effortToggleBtn" class="input-tool-btn effort-toggle-btn hidden" title="Reasoning effort (click to cycle)" data-effort="medium" aria-label="Reasoning effort"><span class="effort-icon">🧠</span><span class="effort-label">M</span></button>
            </div>


            <div class="input-footer-right">
              <!-- Model picker pill -->
              <div class="model-pill-wrapper">
                <button class="model-pill" id="modelPillBtn" title="Switch model">
                  <span class="model-pill-dot" id="modelPillDot"></span>
                  <span class="model-pill-name" id="modelPillName">Loading…</span>
                  <svg class="model-pill-caret" width="9" height="9" viewBox="0 0 10 6" fill="none">
                    <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <!-- Picker popover (opens upward) -->
                <div class="model-picker hidden" id="modelPicker">
                  <div class="model-picker-tabs" id="modelPickerTabs">
                    <button class="mp-tab active" data-type="ollama">Ollama</button>
                    <button class="mp-tab" data-type="groq">Groq</button>
                    <button class="mp-tab" data-type="gemini">Gemini</button>
                    <button class="mp-tab" data-type="openrouter">OpenRouter</button>
                  </div>
                  <div class="model-picker-list" id="modelPickerList"></div>
                </div>
              </div>

              <button id="stopBtn" class="stop-btn" title="Stop generating">
                <svg width="9" height="9" viewBox="0 0 9 9" fill="currentColor"><rect width="9" height="9" rx="2"/></svg>
                Stop
              </button>
              <button id="sendBtn" class="send-btn" title="Send message">
                Send
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
                  <path d="M15 1L7 9M15 1L10 15L7 9M15 1L1 6L7 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      <input type="file" id="imageInput"
          accept="image/*,application/pdf,text/*,.pdf,.txt,.md,.csv,.py,.js,.ts,.json,.yaml,.yml,.sh,.bat,.docx"
          multiple style="display:none">
      </div>

      <!-- Artifacts panel (Cowork mode) -->
      <div class="artifacts-panel hidden" id="artifactsPanel">
        <div class="artifacts-panel-header">
          <div class="artifacts-tabs" id="artifactsTabs"></div>
          <div class="artifacts-panel-actions">
            <button class="artifact-action-btn" id="artifactCopyBtn" title="Copy">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="artifact-action-btn" id="artifactPreviewBtn" title="Toggle preview" style="display:none">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button class="artifact-action-btn" id="artifactCloseBtn" title="Close panel">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="artifacts-panel-body" id="artifactsPanelBody">
          <!-- Content injected by JS -->
        </div>
      </div>

      <!-- Suggestions Panel -->
      <div class="sugg-panel hidden" id="suggPanel">
        <div class="sugg-panel-header">
          <span class="sugg-panel-title">Context</span>
          <button id="suggCloseBtn" class="sugg-close-btn" title="Close">✕</button>
        </div>
        <div class="sugg-panel-body" id="suggPanelBody">
          <div class="sugg-empty">Send a message to see relevant context.</div>
        </div>
      </div>

      <!-- Sidebar - session history -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">History</span>
          <button id="sidebarToggleBtn" class="sidebar-toggle-btn" title="Toggle sidebar (Ctrl+Y)">›</button>
        </div>

        <!-- Chat Sessions -->
        <div class="sidebar-section" id="chatSidebarSection">
          <div class="chats-section-header">
            <span id="chatsLabel">Chat history</span>
            <div class="chats-header-actions">
              <button id="searchChatsBtn" class="chats-search-icon-btn" title="Search chats (Ctrl+Shift+F)">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              </button>
              <button id="newChatBtn" class="new-chat-btn" title="New chat">+</button>
            </div>
          </div>
          <div id="chatsSearchBar" class="chats-search-bar hidden">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="chats-search-bar-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="chatsSearchInput" class="chats-search-input" placeholder="Search sessions…" autocomplete="off" spellcheck="false">
            <button id="chatsSearchClose" class="chats-search-close" title="Clear search">×</button>
          </div>
          <div class="chats-list" id="chatsList">
            <!-- Filled dynamically by renderer.js -->
          </div>
        </div>

        <div class="sidebar-footer">
          <button id="clearChatBtn" class="clear-btn">+ New Chat</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Ctrl+K Session Switcher -->
  <div id="sessionSwitcherModal" class="ssm hidden" role="dialog" aria-label="Switch session">
    <div class="ssm-backdrop"></div>
    <div class="ssm-dialog">
      <div class="ssm-header">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="ssmSearch" class="ssm-search" placeholder="Search sessions…" autocomplete="off" spellcheck="false">
        <kbd class="ssm-esc-hint">ESC</kbd>
      </div>
      <div id="ssmList" class="ssm-list"></div>
      <div class="ssm-footer">
        <span><kbd>↑↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>ESC</kbd> close</span>
      </div>
    </div>
  </div>

  <script src="rag/bm25.js"></script>
  <script src="rag/ragEmbedder.js"></script>
  <script src="rag/docIndex.js"></script>
  <script src="components/ModelSelector.js"></script>
  <script src="components/ChatInterface.js"></script>
  <script src="wakeWord.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
